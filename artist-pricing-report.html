<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AESTUM Artist Pricing Report</title>
<style>
:root{--ink:#171717;--paper:#f3f1ea;--blue:#c8efff;--green:#cfe7c7;--pink:#f7b7b8;--lav:#d8cdf5;--yellow:#f7edbc;--muted:#7b766f}
*{box-sizing:border-box}html,body{margin:0;background:#d8d5cd;color:#111;font-family:Arial,Helvetica,sans-serif}
.report-toolbar{position:sticky;top:0;z-index:20;display:flex;justify-content:center;gap:10px;padding:12px;background:rgba(22,22,22,.96)}
.report-toolbar button,.report-toolbar a{border:0;border-radius:999px;padding:10px 18px;background:#fff;color:#111;text-decoration:none;font:600 12px Arial;cursor:pointer}
.report{padding:24px 0}
.report-page{width:210mm;height:297mm;margin:0 auto 22px;background:#171717;color:#fff;padding:15mm;position:relative;overflow:hidden;border-radius:0}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:22px}
.aestum-brand{display:flex;flex-direction:column;gap:3px}.aestum-brand strong{font-family:Georgia,serif;font-size:26px;letter-spacing:.17em;font-weight:500}.aestum-brand span{font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:#aaa}
.nah-logo{width:145px;background:#f6f1e8;padding:7px 8px}
.kicker{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#c6c1b8}
h1,h2,h3{margin:0;font-weight:600}h1{font-size:34px;line-height:1.05}h2{font-size:22px}h3{font-size:15px}
p{font-size:11px;line-height:1.45;margin:0;color:#d6d4cf}
.page-head{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin:26px 0 22px}
.page-head p{max-width:85%}
.modules{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mod{border-radius:15px;padding:16px;color:#111;background:#fff;min-height:110px}
.mod--wide{grid-column:1/-1}.mod--blue{background:var(--blue)}.mod--green{background:var(--green)}.mod--pink{background:var(--pink)}.mod--lav{background:var(--lav)}.mod--yellow{background:var(--yellow)}
.mod .label{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}.mod .big{font-family:Georgia,serif;font-size:30px;line-height:1}.mod p{color:#2a2a2a}
.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#fff;border-radius:14px;padding:14px;color:#111}.metric span{display:block;font-size:8px;text-transform:uppercase;letter-spacing:.08em;color:#626262}.metric strong{display:block;margin-top:7px;font-family:Georgia,serif;font-size:21px}
.timeline{height:70px;position:relative;margin-top:14px}.timeline:before{content:"";position:absolute;left:0;right:0;top:32px;border-top:1px solid #333}.tick{position:absolute;top:27px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid #333}.tick:after{content:attr(data-label);position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:8px;white-space:nowrap}.bar-row{display:grid;grid-template-columns:110px 1fr 42px;gap:10px;align-items:center;margin:10px 0}.bar-row span{font-size:9px}.bar{height:10px;background:rgba(0,0,0,.11);border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:#171717;border-radius:999px}
.arch-grid{display:grid;grid-template-columns:1.5fr repeat(3,1fr);border-top:1px solid rgba(0,0,0,.2);border-left:1px solid rgba(0,0,0,.2);margin-top:10px}.arch-grid>*{padding:10px;border-right:1px solid rgba(0,0,0,.2);border-bottom:1px solid rgba(0,0,0,.2);font-size:9px}.arch-grid strong{font-size:9px}
.quote{font-family:Georgia,serif;font-size:22px;line-height:1.25;color:#111}
.ring{width:110px;height:110px;border-radius:50%;background:conic-gradient(#171717 var(--pct),rgba(0,0,0,.14) 0);display:grid;place-items:center;margin:6px auto}.ring:after{content:"";width:72px;height:72px;border-radius:50%;background:var(--card,#fff);position:absolute}.ring-wrap{position:relative;text-align:center}.ring-wrap strong{position:absolute;inset:0;display:grid;place-items:center;z-index:2;font-family:Georgia,serif;font-size:23px;color:#111}
.note-list{margin:0;padding-left:17px}.note-list li{margin:7px 0;font-size:10px;line-height:1.4}
.footerline{position:absolute;left:15mm;right:15mm;bottom:9mm;display:flex;justify-content:space-between;font-size:7px;letter-spacing:.08em;text-transform:uppercase;color:#8f8f8f}
.cover{display:flex;flex-direction:column;justify-content:space-between}.cover-main{margin-top:44mm}.cover .title{font-size:50px;line-height:.95;font-family:Georgia,serif;font-weight:500;max-width:150mm}.cover .subtitle{font-size:16px;margin-top:14px;color:#ccc}.cover-card{display:grid;grid-template-columns:1.2fr .8fr;gap:12px;margin-top:28px}.cover-card .mod{min-height:145px}.cover-number{font-family:Georgia,serif;font-size:40px}
.smallcaps{font-size:8px;letter-spacing:.14em;text-transform:uppercase}
.two-col{display:grid;grid-template-columns:1.25fr .75fr;gap:12px}
.disclaimer-box{background:#f4efe6;color:#111;border-radius:14px;padding:16px}.disclaimer-box p{color:#333;font-size:9px}
@media print{
  html,body{background:#fff}
  .report-toolbar{display:none}
  .report{padding:0}
  .report-page{margin:0;border-radius:0;page-break-after:always;break-after:page;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4 portrait;margin:0}
}
</style></head><body>
<div class="report-toolbar"><button onclick="window.print()">Print / Save PDF</button><a href="admin-pricing.html">Back to Pricing Desk</a></div>
<div class="report" data-report-root></div>
<script src="assets/js/artist-pricing-report.js?v=20261004-report1"></script>
</body></html>
